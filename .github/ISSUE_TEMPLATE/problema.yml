name: Problema
description: Algo não funciona como deveria, no software ou no hardware do rover.
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Área
      options:
        - Visão Computacional
        - Eletrônica
        - Software
        - Controle e Automação
        - Mecânica
        - Energia
        - Documentação
        - Várias áreas
    validations:
      required: true
  - type: textarea
    id: ocorrido
    attributes:
      label: O que aconteceu?
      placeholder: Descreva o problema e quando ele aparece.
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: O que deveria acontecer?
    validations:
      required: true
  - type: textarea
    id: reproduzir
    attributes:
      label: Como reproduzir
      placeholder: |
        1. Ligue o rover em...
        2. Execute...
        3. Observe...
  - type: input
    id: versao
    attributes:
      label: Protótipo ou versão
      placeholder: "ex.: P1, commit abc1234"
  - type: textarea
    id: evidencias
    attributes:
      label: Evidências
      description: Logs, fotos, vídeos ou medições. Arraste os arquivos para cá.
